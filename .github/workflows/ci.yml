name: ci

on:
  push:
    branches: [main]
  pull_request:

# Production builds run on Cloudflare's own pipeline (opennextjs-cloudflare
# build); CI gates the mergeable quality signals that need no secrets.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
